# ADE20K semantic segmentation.
# UPerNet decoder over blocks 3/5/7/11 of the pre-trained ViT-B/16 encoder.
data:
  root_path: ./data/            # parent folder of ADEChallengeData2016/
  image_folder: ADEChallengeData2016
  dataset_name: ade20k
  num_classes: 150
  crop_size: 512                # 512x512 training crops
  base_size: [2048, 512]        # base scale before the 0.5-2.0 random resize
  ratio_range: [0.5, 2.0]
  test_scale: [2048, 512]
  batch_size_per_replica: 2     # 2 x 8 GPUs = global batch size 16
  num_workers: 8
  pin_memory: True
segmentation:
  channels: 512
  pool_scales: [1, 2, 3, 6]
  dropout: 0.1
  use_aux_head: True
  aux_index: 2
  aux_channels: 256
  aux_loss_weight: 0.4
opt:
  iterations: 160000
  name: adamw
  clip_grad: 0.0
  weight_decay: 0.05
  lr:
    auto_lr_scaling: False
    base_lr: 1.0e-04
    base_lr_batch_size: 16
    warmup_iters: 1500
    warmup_ratio: 1.0e-06
    power: 1.0
    min_lr: 0.0
    backbone_lr_scale: 1.0
  use_bfloat16: True
  bias_decay: False
  norm_decay: False
  global_seed: 0
framework:
  name: segmentation
model:
  pretrained_weights: # YOUR PATH HERE
  model_name: vit_base
  patch_size: 16
  crop_size: 224                # pre-training resolution (positional grid)
  use_masked_vit: True
  use_class_token: True
  out_layers: [3, 5, 7, 11]     # 0-indexed blocks feeding the UPerNet neck
  drop_path_rate: 0.1
  window_size: 0                # global attention at 512x512
  use_checkpoint: False
  freeze_backbone: False
resume:
  resume_path: null
logging:
  log_dir: logs/ade20k_upernet_dseqjepa_vitb16/
  log_step_freq: 50
  use_tensorboard: True
  use_csv: True
  log_stdout: True
  ckpt:
    save_latest: True
    save_best: True
    ckpt_iter_freq: 8000
  wandb:
    use_wandb: True
    project_name: FG-JEPA
    entity: shuns71
    run_name: ade20k_upernet_dseqjepa_vitb16
  eval:
    eval_iter_freq: 16000
    slide_stride: 341           # sliding-window inference: 512x512 crop, stride 341
