data:
  root_path: /newssd/datasets/
  dataset_name: imagenet1k
  train_subset_file: null
  test_subset_file: null
  batch_size_per_replica: 32
  num_workers: 8
  pin_memory: true
  augmentation:
    crop_size: 224
    img_size: 256
    interpolation: 3
  image_folder: imagenet
opt:
  epochs: 28
  name: sgd
  ipe_scale: 1.0
  clip_grad: 0.0
  weight_decay: 0.0005
  momentum: 0.9
  nesterov: true
  lr:
    auto_lr_scaling: true
    base_lr: 0.01
    base_lr_batch_size: 256
    name: multistep
    lr_values:
    - 0.01
    - 0.001
    - 0.0001
    - 1.0e-05
    milestones:
    - 8
    - 16
    - 24
  use_bfloat16: false
  bias_decay: false
  norm_decay: false
  global_seed: 0
framework:
  name: probing
model:
  pretrained_weights: ./vit-h16-cls.pth.tar
  model_name: vit_huge
  patch_size: 14
  use_masked_vit: true
  use_class_token: true
  num_classes: 1000
  head_type: linear
  use_bn: true
resume:
  resume_path: null
logging:
  log_dir: logs/probing_vith14_in1k/
  log_step_freq: 100
  use_tensorboard: true
  use_csv: true
  log_stdout: true
  ckpt:
    save_latest: true
    ckpt_epoch_freq: 10
    save_best: true
  wandb:
    use_wandb: true
    project_name: FG-JEPA
    entity: shuns71
    run_name: probing_vith14_in1k
  eval:
    eval_epoch_freq: 1
