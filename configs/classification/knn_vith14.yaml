data:
  root_path: /newssd/datasets/
  dataset_name: imagenet1k
  train_subset_file: meta/in1k_subset10.0%_seed0_train_localnames.txt
  test_subset_file: null
  batch_size_per_replica: 128
  num_workers: 8
  pin_memory: true
  augmentation:
    crop_size: 224
    img_size: 256
    interpolation: 3
    use_gaussian_blur: false
    use_horizontal_flip: false
    use_color_distortion: false
    color_jitter_strength: 0.0
  image_folder: imagenet
knn:
  knn_k: 20
  knn_t: 0.07
  num_classes: 1000
  feature_strategy:
  - lastCLS
  - concatCLS4
  - lastPOOL
  - concatPOOL4
  use_amp: false
  sim_chunk_size: 4096
framework:
  name: knn
model:
  pretrained_weights: ./vit-h16-cls.pth.tar
  model_name: vit_huge
  patch_size: 14
  use_masked_vit: true
  use_class_token: true
  num_classes: 1000
logging:
  log_dir: logs/knn_vith14_in1k/
  verbose: true
